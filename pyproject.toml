[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corporate-fpa-toolkit"
version = "0.1.0"
description = "A fully synthetic driver-based FP&A toolkit: budgeting, variance analysis, rolling forecasts, cash flow modeling, scenario/sensitivity analysis, capital allocation, and board reporting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["corporate_fpa_toolkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
